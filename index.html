<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>スーパーポリスアドベンチャー - 2Dプラットフォーマー</title>
  <link rel="stylesheet" href="./styles/style.css"/>
</head>
<body>
  <div id="app">
    <!-- Game Header -->
    <header class="game-header">
      <div class="brand">
        <div class="brand__icon">🎮</div>
        <div class="brand__text">
          <div class="brand__title">スーパーポリスアドベンチャー</div>
          <div class="brand__subtitle">2Dプラットフォーマー</div>
        </div>
      </div>
      <div class="game-stats">
        <div class="stat-item">
          <span class="stat-icon">❤️</span>
          <span class="stat-label">ライフ:</span>
          <span id="lives" class="stat-value">3</span>
        </div>
        <div class="stat-item">
          <span class="stat-icon">⭐</span>
          <span class="stat-label">スコア:</span>
          <span id="score" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-icon">🪙</span>
          <span class="stat-label">コイン:</span>
          <span id="coins" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-icon">🏆</span>
          <span class="stat-label">レベル:</span>
          <span id="level" class="stat-value">1</span>
        </div>
      </div>
    </header>

    <!-- Main Game Area -->
    <main class="game-container">
      <canvas id="gameCanvas" width="1200" height="600"></canvas>
      
      <!-- Game Overlay (Start/Pause/Game Over screens) -->
      <div id="gameOverlay" class="game-overlay">
        <div class="overlay-content">
          <h1 id="overlayTitle" class="overlay-title">🎮 スーパーポリスアドベンチャー</h1>
          <p id="overlayMessage" class="overlay-message">矢印キーまたはWASDで移動、スペースでジャンプ！<br>コインを集めて、敵を避けながらゴールを目指せ！</p>
          <div class="overlay-stats hidden" id="finalStats">
            <div class="final-score">最終スコア: <span id="finalScore">0</span></div>
          </div>
          <button id="startBtn" class="btn btn--primary btn--large">ゲームスタート</button>
        </div>
      </div>
      
      <!-- Pause Menu -->
      <div id="pauseMenu" class="pause-menu hidden">
        <div class="pause-content">
          <h2>⏸️ 一時停止</h2>
          <button id="resumeBtn" class="btn btn--primary">再開</button>
          <button id="restartBtn" class="btn btn--secondary">最初から</button>
        </div>
      </div>
    </main>

    <!-- Controls Help -->
    <footer class="game-footer">
      <div class="controls-help">
        <div class="control-item">
          <kbd>←</kbd><kbd>→</kbd> または <kbd>A</kbd><kbd>D</kbd>
          <span>移動</span>
        </div>
        <div class="control-item">
          <kbd>Space</kbd> または <kbd>W</kbd><kbd>↑</kbd>
          <span>ジャンプ</span>
        </div>
        <div class="control-item">
          <kbd>P</kbd> または <kbd>Esc</kbd>
          <span>一時停止</span>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
